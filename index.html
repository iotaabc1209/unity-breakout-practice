<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TFT風リロール工場 - 単一HTMLプロトタイプ</title>
  <style>
    :root{--bg:#151923;--panel:#202737;--panel2:#2a3347;--ink:#edf2ff;--muted:#aab4ca;--accent:#77d9b3;--warn:#ffd166;--bad:#ff7b7b;--line:#3b465f;--blue:#8ecae6;--purple:#cdb4db}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.35}
    header{padding:18px 22px;border-bottom:1px solid var(--line);background:#10141d} h1{margin:0 0 6px;font-size:22px} .note{color:var(--muted);font-size:13px}
    main{display:grid;grid-template-columns:330px 1fr 360px;gap:14px;padding:14px;max-width:1500px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 4px 18px #0004}.panel h2{margin:0 0 10px;font-size:17px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:var(--panel2);border-radius:9px;padding:8px}.stat b{display:block;font-size:20px}.stat span{color:var(--muted);font-size:12px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:8px;padding:8px 10px;background:#3d8bfd;color:white;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.08)}button:disabled{background:#596276;color:#aeb6c8;cursor:not-allowed}.secondary{background:#536179}.danger{background:#b64b5b}.good{background:#2c9b73}.shop,.board{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px}.board{grid-template-columns:repeat(4,minmax(130px,1fr))}.card{background:#f7f2e8;color:#202020;border:3px solid #bfa36a;border-radius:10px;padding:9px;min-height:142px;display:flex;flex-direction:column;gap:5px}.card.cost2{border-color:#78a6d9}.card.cost4{border-color:#b27de0;background:#fbf4ff}.card .name{font-weight:900}.tags{display:flex;gap:4px;flex-wrap:wrap}.tag{font-size:12px;background:#273247;color:#fff;border-radius:999px;padding:2px 7px}.tag.role{background:#694f8e}.meta{font-size:13px}.card button{margin-top:auto;width:100%;font-size:13px;padding:6px}.empty{border:1px dashed var(--line);border-radius:10px;min-height:120px;display:flex;align-items:center;justify-content:center;color:var(--muted)}.synergy-row,.demand-row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #ffffff12}.pill{border-radius:999px;background:var(--panel2);padding:2px 8px;font-size:12px}.active{color:var(--accent);font-weight:800}.log{height:300px;overflow:auto;background:#10141d;border-radius:9px;padding:9px;font-family:ui-monospace,monospace;font-size:12px}.log div{padding:3px 0;border-bottom:1px solid #ffffff0c}.score{font-size:28px;color:var(--warn)}details{margin-top:10px;color:var(--muted)}@media(max-width:1050px){main{grid-template-columns:1fr}.shop,.board{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}}
  </style>
</head>
<body>
<header><h1>TFT風リロール工場：カードゲーム検証プロトタイプ</h1><div class="note">需要は構築を誘導せず、盤面出力だけを評価します。寄り・リロール・利子・Fast8相当のレベル投資を試すための単一HTMLです。</div></header>
<main>
  <section class="panel"><h2>状態</h2><div id="stats" class="stats"></div><div class="btns"><button id="reroll">リロール -2AP</button><button id="level" class="good">レベルアップ</button><button id="end" class="secondary">ターン終了</button><button id="new" class="danger">新規ゲーム</button></div><details><summary>ルール要約</summary><p>全8ラウンド。ラウンド開始時に基礎AP4を得る。終了時に出力に応じた最高需要を1枚獲得し、残AP5ごとに次ラウンド用AP利子を最大+3得ます。盤面枠は12固定、レベルはショップ確率だけを変えます。</p></details></section>
  <section class="panel"><h2>ショップ</h2><div id="shop" class="shop"></div><h2 style="margin-top:16px">盤面 / 工場枠 12</h2><div id="board" class="board"></div></section>
  <aside class="panel"><h2>出力・シナジー</h2><div id="synergy"></div><h2 style="margin-top:14px">需要カード残数</h2><div id="demands"></div><h2 style="margin-top:14px">ログ</h2><div id="log" class="log"></div></aside>
</main>
<script>
const RES=['小麦','木材','鉱石','綿'], ROLES=['供給','加工','商業'];
const NAMES={1:{'小麦供給':'小麦畑','小麦加工':'製粉小屋','小麦商業':'小麦市','木材供給':'木こり場','木材加工':'製材小屋','木材商業':'木材市','鉱石供給':'採掘場','鉱石加工':'精錬小屋','鉱石商業':'鉱石市','綿供給':'綿花畑','綿加工':'紡績小屋','綿商業':'綿市'},2:{'小麦供給':'大農園','小麦加工':'製粉工場','小麦商業':'穀物商会','木材供給':'大森林','木材加工':'製材工場','木材商業':'木材商会','鉱石供給':'大鉱山','鉱石加工':'鍛冶工場','鉱石商業':'鉱石商会','綿供給':'綿花農園','綿加工':'織物工場','綿商業':'繊維商会'},4:{'小麦供給':'王立農園','小麦加工':'王立製粉所','小麦商業':'王立穀物市場','木材供給':'王立森林','木材加工':'王立製材所','木材商業':'王立木材市場','鉱石供給':'王立鉱山','鉱石加工':'王立鍛冶場','鉱石商業':'王立鉱石市場','綿供給':'王立綿花園','綿加工':'王立織物所','綿商業':'王立繊維市場'}};
const ODDS={1:[.80,.20,0],2:[.55,.40,.05],3:[.30,.50,.20],4:[.15,.35,.50]}, LEVEL_COST={1:4,2:6,3:8}, BASE_AP=4, MAX_ROUND=8;
let s;
function cards(){let a=[]; for(const cost of [1,2,4]) for(const r of RES) for(const role of ROLES){let copies=cost===1?12:cost===2?9:6; a.push({id:`${cost}-${r}-${role}`,name:NAMES[cost][r+role],cost,res:r,role,copies});} return a}
function newGame(){s={round:1,ap:4,interest:0,level:1,shop:[],board:[],pool:cards(),demands:{4:{need:4,pts:3,left:6,label:'低需要'},7:{need:7,pts:6,left:5,label:'中需要'},10:{need:10,pts:10,left:3,label:'高需要'},12:{need:12,pts:15,left:2,label:'最高需要'}},claimed:[],log:[]}; roll(true); log('ゲーム開始。初期AP4。'); render();}
function log(t){s.log.unshift(`R${s.round}: ${t}`)}
function drawCost(){let o=ODDS[s.level], x=Math.random(); return x<o[0]?1:x<o[0]+o[1]?2:4}
function avail(cost){return s.pool.filter(c=>c.cost===cost&&c.copies>0)}
function drawCard(){let cost=drawCost(), list=avail(cost); if(!list.length) list=s.pool.filter(c=>c.copies>0); let base=list[Math.floor(Math.random()*list.length)]; return {...base, star:1, uid:crypto.randomUUID()}}
function roll(free=false){if(!free){if(s.ap<2)return; s.ap-=2} s.shop=Array.from({length:5},drawCard); if(!free) log('ショップをリロール。'); render()}
function buy(i){let c=s.shop[i]; if(!c||s.ap<c.cost)return; if(s.board.length>=12){log('盤面が満杯です。先に破棄してください。'); return} s.ap-=c.cost; let p=s.pool.find(x=>x.id===c.id); if(p) p.copies--; s.board.push({...c}); s.shop[i]=null; combine(c.id); log(`${c.name}を購入。`); render()}
function combine(id){let changed=true; while(changed){changed=false; for(const star of [1,2]){let same=s.board.filter(c=>c.id===id&&c.star===star); if(same.length>=3){let keep=same[0].uid, remove=new Set(same.slice(1,3).map(c=>c.uid)); s.board=s.board.filter(c=>!remove.has(c.uid)); s.board.find(c=>c.uid===keep).star=star+1; log(`${same[0].name} が ${'☆'.repeat(star+1)} に合成！`); changed=true; break}}}}
function sell(uid){let c=s.board.find(x=>x.uid===uid); s.board=s.board.filter(x=>x.uid!==uid); log(`${c.name}を破棄（AP返還なし）。`); render()}
function levelUp(){let cost=LEVEL_COST[s.level]; if(!cost||s.ap<cost)return; s.ap-=cost; s.level++; log(`Lv${s.level}に上昇。ショップ確率が変化。`); render()}
function cardPower(c){return ({1:[0,1,2,5],2:[0,2,4,8],4:[0,4,7,13]})[c.cost][c.star]}
function bonus(n){return n>=6?4:n>=4?2:n>=2?1:0}
function calc(){let base=s.board.reduce((a,c)=>a+cardPower(c),0), rc={}, oc={}; s.board.forEach(c=>{rc[c.res]=(rc[c.res]||0)+1; oc[c.role]=(oc[c.role]||0)+1}); let rb=Math.max(0,...Object.values(rc).map(bonus)), ob=Math.max(0,...Object.values(oc).map(bonus)); return {base,rc,oc,rb,ob,total:base+rb+ob}}
function endTurn(){let out=calc().total, got=null; for(const need of [12,10,7,4]) if(out>=need && s.demands[need].left>0){got=s.demands[need];break} if(!got){for(const need of [10,7,4]) if(out>=need && s.demands[need].left>0){got=s.demands[need];break}} if(got){got.left--; s.claimed.push({label:got.label,pts:got.pts,need:got.need}); log(`出力${out}で${got.label}を獲得（${got.pts}点）。`)} else log(`出力${out}。獲得できる需要なし。`); let interest=Math.min(3,Math.floor(s.ap/5)); if(s.round>=MAX_ROUND){log(`ゲーム終了！最終点 ${score()} 点。`); render(true); return} s.round++; s.ap+=BASE_AP+interest; roll(true); log(`利子+${interest}、基礎AP+4。`); render()}
function score(){let n=s.claimed.length, bonus=n>=6?20:[0,0,2,5,9,14][n]; return s.claimed.reduce((a,c)=>a+c.pts,0)+bonus}
function esc(x){return String(x).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function cardHTML(c,action){return `<div class="card cost${c.cost}"><div class="name">${esc(c.name)}</div><div class="meta">${c.cost}コス / ${'☆'.repeat(c.star)} / 出力${cardPower(c)}</div><div class="tags"><span class="tag">${c.res}</span><span class="tag role">${c.role}</span></div>${action}</div>`}
function render(done=false){let c=calc(), next=LEVEL_COST[s.level]||'最大', n=s.claimed.length, demandBonus=n>=6?20:[0,0,2,5,9,14][n]; document.getElementById('stats').innerHTML=[['ラウンド',`${s.round}/${MAX_ROUND}`],['AP',s.ap],['レベル',s.level],['次Lvコスト',next],['現在出力',c.total],['所持点',`<span class="score">${score()}</span>`],['需要枚数',`${n}枚`],['枚数ボーナス',demandBonus]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join(''); document.getElementById('shop').innerHTML=s.shop.map((x,i)=>x?cardHTML(x,`<button ${s.ap<x.cost||done?'disabled':''} onclick="buy(${i})">購入 -${x.cost}AP</button>`):'<div class="empty">購入済み</div>').join(''); document.getElementById('board').innerHTML=s.board.map(x=>cardHTML(x,`<button class="danger" onclick="sell('${x.uid}')">破棄</button>`)).join('')+Array.from({length:Math.max(0,12-s.board.length)},()=>'<div class="empty">空き枠</div>').join(''); document.getElementById('synergy').innerHTML=`<div class="synergy-row"><b>カード出力合計</b><span>${c.base}</span></div><div class="synergy-row"><b>最大資源ボーナス</b><span class="active">+${c.rb}</span></div><div class="synergy-row"><b>最大役割ボーナス</b><span class="active">+${c.ob}</span></div>`+[...RES.map(r=>[r,c.rc[r]||0]),...ROLES.map(r=>[r,c.oc[r]||0])].map(([k,v])=>`<div class="synergy-row"><span>${k}</span><span>${v}枚 <span class="pill">次:${v<2?'2枚+1':v<4?'4枚+2':v<6?'6枚+4':'最大'}</span></span></div>`).join(''); document.getElementById('demands').innerHTML=[4,7,10,12].map(k=>{let d=s.demands[k];return `<div class="demand-row"><span>${d.label} 必要${d.need} / ${d.pts}点</span><b>${d.left}枚</b></div>`}).join(''); document.getElementById('log').innerHTML=s.log.map(x=>`<div>${esc(x)}</div>`).join(''); reroll.disabled=s.ap<2||done; level.disabled=!LEVEL_COST[s.level]||s.ap<LEVEL_COST[s.level]||done; end.disabled=done;}
document.getElementById('reroll').onclick=()=>roll(); document.getElementById('level').onclick=()=>levelUp(); document.getElementById('end').onclick=()=>endTurn(); document.getElementById('new').onclick=()=>newGame(); newGame();
</script>
</body>
</html>
